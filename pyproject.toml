[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "treeneuron"
version = "0.1.0"
description = "Selective affine-stump allocation research proof of concept"
readme = "README.md"
license = "AGPL-3.0-only AND CC-BY-4.0"
license-files = ["LICENSE", "NOTICE", "LICENSING.md", "THIRD_PARTY_NOTICES.md", "licenses/CC-BY-4.0.txt", "src/treeneuron/baselines/_node_vendor/LICENSE*"]
authors = [{name = "Artem Legotin"}]
requires-python = ">=3.12,<3.13"
dependencies = ["torch", "numpy", "scipy", "pandas", "scikit-learn", "PyYAML"]

[dependency-groups]
dev = ["pytest"]

[project.urls]
Repository = "https://github.com/arlegotin/adaptive-tree-neurons"
Issues = "https://github.com/arlegotin/adaptive-tree-neurons/issues"
Documentation = "https://github.com/arlegotin/adaptive-tree-neurons/blob/main/REPRODUCE.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
